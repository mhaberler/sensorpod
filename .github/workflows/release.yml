name: Release firmware

on:
  push:
    tags:
      - "v*"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.set.outputs.envs }}
    steps:
      - uses: actions/checkout@v5
      - id: set
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import configparser, json
          cp = configparser.ConfigParser()
          cp.read("platformio.ini")
          envs = cp.get("ci", "envs").split()
          print(f"envs={json.dumps(envs)}")
          PY

  build:
    needs: setup
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platformio_env: ${{ fromJSON(needs.setup.outputs.envs) }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # - uses: actions/cache@v5
      #   with:
      #     path: ~/.cache/pip
      #     key: ${{ runner.os }}-pip-platformio
      #     restore-keys: ${{ runner.os }}-pip-

      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'platformio-m5stack.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Clean firmware directory
        run: rm -rf firmware && mkdir -p firmware

      - name: Build merged firmware
        shell: bash
        env:
          # set the repo variable BUILD_OTA_BIN to "yes" to include
          # app-only *_ota.bin artifacts in releases
          CUSTOM_BUILD_OTA_BIN: ${{ vars.BUILD_OTA_BIN || 'no' }}
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt..."
            if pio run -e ${{ matrix.platformio_env }} -t firmware; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed, cleaning PlatformIO package cache before retry..."
              rm -rf ~/.platformio/.cache
              sleep 15
            fi
          done
          exit 1

      - name: Write board metadata for install page
        env:
          PIO_ENV: ${{ matrix.platformio_env }}
        run: |
          python - <<'PY2'
          import json, os, re
          hdr = open("include/build_info.hpp").read()
          get = lambda k: (re.search(rf'#define {k} "([^"]*)"', hdr) or [None, None])[1]
          env = os.environ["PIO_ENV"]
          meta = {"env": env, "mcu": get("BUILD_MCU"), "board_name": get("BUILD_BOARD_NAME")}
          json.dump(meta, open(f"firmware/{env}.meta.json", "w"))
          print(meta)
          PY2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.platformio_env }}
          path: |
            firmware/*.bin
            firmware/*.meta.json
          if-no-files-found: error

  release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          path: firmware
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: firmware/*.bin
          generate_release_notes: true

  pages:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          path: firmware
          merge-multiple: true

      - name: Assemble ESP Web Tools install site
        run: python scripts/build_pages_site.py firmware site _site "${GITHUB_REF_NAME}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
